[project]
name = "fastapi-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.10",
    "pymongo>=4.11.1",
    "bcrypt>=5.0.0",
    "boto3>=1.43.19",
    "celery>=5.6.3",
    "colorlog>=6.10.1",
    "flower>=2.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.136.3",
    "greenlet>=3.5.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.14.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.30",
    "redis>=8.0.0",
    "sendgrid>=6.12.5",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.48.0",
    "uuid6>=2025.0.1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.black]
line-length = 88
target-version = ['py313']

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [".git", "__pycache__", ".venv", "alembic/"]
lint.select = ["E", "F", "I", "W"]
lint.ignore = ["E203", "E501"]
